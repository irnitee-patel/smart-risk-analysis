<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Risk Analysis | AI Model</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- ✅ Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }
    header {
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }
    header h1 { font-size: 22px; font-weight: 600; }
    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }
    .hero {
      padding: 80px 8%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .hero-text { max-width: 550px; }
    .hero-text h2 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .hero-text p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .card {
      background: #ffffff;
      color: #111827;
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .card h3 { margin-bottom: 20px; }
    .card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      font-family: inherit;
    }
    .card button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .metrics {
      padding: 60px 8%;
      background: #f8fafc;
      color: #111827;
      text-align: center;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px;
    }
    .metric-box {
      background: white;
      padding: 25px;
      border-radius: 16px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #0f172a;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>Smart Risk AI</h1>
</header>

<section class="hero">
  <div class="hero-text">
    <h2>AI Powered Risk Assessment Model</h2>
    <p>This system predicts financial risk using machine learning algorithms.</p>
  </div>

  <div class="card">
    <h3>Analyze Risk</h3>

    <!-- ✅ FIXED FORM -->
    <form onsubmit="runAnalysis(event)">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="number" name="age" placeholder="Age" required>
      <input type="number" name="income" placeholder="Monthly Income" required>
      <input type="number" name="credit" placeholder="Credit Score" required>
      <button type="submit">Run AI Analysis</button>
    </form>

    <!-- ✅ RESULT -->
    <div id="result" style="margin-top:15px; font-weight:600;"></div>

    <!-- ✅ CHART -->
    <canvas id="riskChart" style="margin-top:20px;"></canvas>

  </div>
</section>

<footer>
  © 2026 Smart Risk Analysis System
</footer>

<!-- ✅ JAVASCRIPT -->
<script>
let chart;

function runAnalysis(e) {
  e.preventDefault();

  let name = document.querySelector('input[name="name"]').value;
  let age = parseInt(document.querySelector('input[name="age"]').value);
  let income = parseInt(document.querySelector('input[name="income"]').value);
  let credit = parseInt(document.querySelector('input[name="credit"]').value);

  let score = (credit / 10) + (income / 1000) + (age * 0.5);
  if (score > 100) score = 100;

  let status = "";
  if (score > 70) status = "Low Risk ✅";
  else if (score > 40) status = "Medium Risk ⚠️";
  else status = "High Risk ❌";

  document.getElementById("result").innerHTML =
    `<b>${name}</b><br>
     Risk Score: <b>${score.toFixed(1)}%</b><br>
     Status: <b>${status}</b>`;

  drawChart(score);
}

function drawChart(score) {
  const ctx = document.getElementById('riskChart');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Risk Score', 'Remaining'],
      datasets: [{
        data: [score, 100 - score],
        backgroundColor: ['#4f46e5', '#e5e7eb']
      }]
    },
    options: {
      cutout: '70%',
      plugins: { legend: { display: false } }
    }
  });
}
</script>

</body>
</html>
