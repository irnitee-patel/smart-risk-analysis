<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Risk Analysis | AI Model</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    header {
      padding: 20px 8%;
      background: rgba(0,0,0,0.3);
    }

    .hero {
      padding: 80px 8%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .hero-text { max-width: 500px; }

    .card {
      background: white;
      color: black;
      padding: 30px;
      border-radius: 20px;
      width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }

    .card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .card button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
    }

    canvas {
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h2>Smart Risk AI</h2>
</header>

<section class="hero">
  <div class="hero-text">
    <h2>AI Risk Prediction</h2>
    <p>Smart financial risk analysis using AI logic</p>
  </div>

  <div class="card">
    <h3>Analyze Risk</h3>

    <form onsubmit="runAnalysis(event)">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="number" name="age" placeholder="Age" required>
      <input type="number" name="income" placeholder="Monthly Income" required>
      <input type="number" name="credit" placeholder="Credit Score" required>
      <button type="submit">Run AI Analysis</button>
    </form>

    <div id="result" style="margin-top:15px;"></div>

    <!-- Doughnut Chart -->
    <canvas id="riskChart"></canvas>

    <!-- Bar Chart -->
    <canvas id="factorChart"></canvas>

  </div>
</section>

<footer>© 2026 Smart Risk AI</footer>

<script>
let chart, barChart;

function getColor(score) {
  if (score > 70) return "green";
  else if (score > 40) return "orange";
  else return "red";
}

function runAnalysis(e) {
  e.preventDefault();

  document.getElementById("result").innerHTML = "Analyzing...";

  setTimeout(() => {

    let name = document.querySelector('[name="name"]').value;
    let age = parseInt(document.querySelector('[name="age"]').value);
    let income = parseInt(document.querySelector('[name="income"]').value);
    let credit = parseInt(document.querySelector('[name="credit"]').value);

  // ✅ Normalization (balanced logic)
let normCredit = credit / 850 * 100;
let normIncome = income / 100000 * 100;
let normAge = age / 100 * 100;

// ✅ Weighted score
let score = (normCredit * 0.5) + (normIncome * 0.3) + (normAge * 0.2);

// Optional penalty
if (credit < 500) score -= 20;

// Limit score
if (score > 100) score = 100;
if (score < 0) score = 0;

    let status = score > 70 ? "Low Risk ✅" :
                 score > 40 ? "Medium Risk ⚠️" :
                 "High Risk ❌";

    let explanation = score > 70 ?
      "Strong financial stability and good credit." :
      score > 40 ?
      "Moderate financial condition." :
      "High risk due to poor financial indicators.";

    document.getElementById("result").innerHTML =
      `<b>${name}</b><br>
       Risk Score: <b>${score.toFixed(1)}%</b><br>
       Status: <span style="color:${getColor(score)}">${status}</span><br>
       <small>${explanation}</small>`;

    drawChart(score);
    drawBarChart(age, income, credit);

  }, 800);
}

// Doughnut Chart
function drawChart(score) {
  const ctx = document.getElementById('riskChart');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      datasets: [{
        data: [score, 100-score],
        backgroundColor: ['#4f46e5','#e5e7eb']
      }]
    },
    options: {
      cutout: '70%',
      animation: { duration: 1000 },
      plugins: { legend: { display: false } }
    }
  });
}

// Bar Chart (Multi-factor dashboard)
function drawBarChart(age, income, credit) {
  const ctx = document.getElementById('factorChart');

  if (barChart) barChart.destroy();

  barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Age', 'Income (k)', 'Credit'],
      datasets: [{
        data: [age, income/1000, credit],
        backgroundColor: ['#6366f1','#22c55e','#f59e0b']
      }]
    },
    options: {
      plugins: { legend: { display: false } }
    }
  });
}
</script>

</body>
</html>
